name: Build and Lint

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "39 9 * * 1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm audit --audit-level=high
